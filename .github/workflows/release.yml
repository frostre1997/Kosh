name: release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-release:
    name: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode and create keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > /tmp/kosh.keystore

      - name: Decode and create signing.properties
        run: echo "${{ secrets.PROP }}" | base64 -d > /tmp/signing.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew assembleRelease && mv app/build/outputs/apk/release/*.apk app/kosh-${{ env.COMMIT_HASH }}.apk
        env:
          KEYSTORE_FILE: /tmp/kosh.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
        continue-on-error: false

      - name: Archive Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kosh-Release
          path: app/kosh-${{ env.COMMIT_HASH }}.apk

      - name: Delete keystore and signing.properties
        run: rm /tmp/kosh.keystore /tmp/signing.properties
